[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-review"
version = "0.1.0"
description = "Deterministic protocol models for agent-to-agent code review"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
]

[project.scripts]
agent-review = "agent_review.cli:run"
agent-review-mcp = "agent_review.mcp_server:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
