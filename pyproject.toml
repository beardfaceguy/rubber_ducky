[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rubber-ducky"
version = "0.1.0"
description = "Deterministic protocol engine for agent-to-agent code and plan review"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.16",
    "langchain-core>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
agent-review = "rubber_ducky.code.cli:run"
agent-review-mcp = "rubber_ducky.code.mcp_server:run"
plan-review = "rubber_ducky.plan.cli:run"
plan-review-mcp = "rubber_ducky.plan.mcp_server:run"
rubber-ducky-mcp = "rubber_ducky.mcp_server:run"

[project.optional-dependencies]
openai = [
    "langchain-openai>=1.6.0",
]
anthropic = [
    "langchain-anthropic>=1.6.1",
]
openrouter = [
    "langchain-openrouter>=0.2.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
